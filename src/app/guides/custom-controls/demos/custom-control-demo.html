<demo-layout>
  <form class="demo">
    <div class="mb-2 flex gap-2">
      <input
        [formField]="myForm.disableForm"
        id="disable-form-checkbox"
        type="checkbox"
        class="mb-2"
      />
      <label class="input-label" for="disable-form-checkbox"> Disable Form </label>
    </div>
    <div class="mb-2">
      <slider [formField]="myForm.range" [title]="'Range'" />
    </div>
  </form>
  <form-inspector class="inspector" [root]="myForm"></form-inspector>
</demo-layout>
